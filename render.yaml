# render.yaml - Render Blueprint for one-click deployment
# Reference: https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: lms-postgres
    plan: free
    databaseName: lms_db
    databaseUser: lms_user
    ipAllowList: [] # Allow all IPs (restrict in production)

  # Django Web Service
  - type: web
    name: library-management-system
    env: python
    region: oregon # or choose your preferred region
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      # Database connection from Render PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: lms-postgres
          property: connectionString
      # Map Render DATABASE_URL to Django settings
      - key: DB_HOST
        fromDatabase:
          name: lms-postgres
          property: host
      - key: DB_NAME
        fromDatabase:
          name: lms-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: lms-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: lms-postgres
          property: password
      - key: DB_PORT
        value: "5432"
      # Django settings
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render will auto-generate on first deploy
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com"
      # Static/Media settings
      - key: STATIC_URL
        value: "/static/"
      - key: MEDIA_URL
        value: "/media/"
      # Timezone
      - key: TIME_ZONE
        value: "Asia/Kolkata"
